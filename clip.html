<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip - ClipNow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="navbar" id="clipnow-navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>
  <div class="nav-center">
    <a href="index.html" id="nav-explore">Explore</a>
    <a href="upload.html" id="nav-upload">Upload</a>
    <a href="search.html" id="nav-search">Search</a>
    <a href="profile.html" id="nav-profile">Profile</a>
    <a href="download.html" id="nav-download">Download</a>
  </div>
  <div class="nav-right">
    <a href="login.html" id="nav-login" class="btn btn-primary">Sign in</a>
    <div id="nav-user">
      <a href="profile.html" id="nav-username" class="nav-username"></a>
      <button type="button" onclick="logout()" class="btn btn-outline">Logout</button>
    </div>
  </div>
</nav>
<div class="container">
  <div id="error" class="error"></div>
  <div id="content" style="display:none">
    <div class="player"><video id="video" controls playsinline></video></div>
    <h1 class="clip-title" id="title"></h1>
    <div class="clip-meta" id="meta"></div>
    <div class="actions" id="actions"></div>
    <div class="desc" id="description"></div>
    <div id="comments-wrap" style="max-width:900px">
      <h2 class="section-title" style="font-size:16px;margin-bottom:12px">Comments</h2>
      <div class="form-group" id="comment-form-wrap" style="display:none">
        <textarea id="comment-body" placeholder="Add a comment" maxlength="500"></textarea>
        <button class="btn btn-green" id="comment-btn" style="margin-top:8px">Post</button>
      </div>
      <div id="comment-list" class="comment-list"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
let clip=null,myProfile=null,me=null,hasLiked=false;
function showError(m){const el=document.getElementById("error");el.textContent=m;el.style.display="block";}

async function loadClip(){
  const id=new URLSearchParams(location.search).get("id");
  me=await getCurrentUser();myProfile=me?await getProfile():null;
  let result=await getClipById(id);
  if(!result.data){showError(result.error?.message||"Clip not found or private");return;}
  clip=result.data;
  const cleanTitle=String(clip.title||"Untitled").replace(/^\[\[RAINBOW\]\]\s*/,"").trim()||"Untitled";
  const isRainbowTitle=String(clip.title||"").startsWith("[[RAINBOW]]");
  const isOwner=!!(me&&me.id===clip.user_id),amDev=myProfile?.is_dev===true;
  if(clip.visibility==="private"&&!isOwner&&!amDev){showError("This clip is private");return;}
  document.getElementById("content").style.display="block";
  document.getElementById("title").innerHTML=isRainbowTitle?`<span class="rainbow-title">${escapeHtml(cleanTitle)}</span>`:escapeHtml(cleanTitle);
  document.title=cleanTitle+" - ClipNow";
  const playback=await getClipPlaybackUrl(clip.file_path);
  document.getElementById("video").src=playback;
  const author=clip.profiles,handle=author?.username||"";
  const authorName=author?.display_name||author?.username||"Unknown";
  const nameHtml=author?.rainbow_name?`<span class="rainbow-name">${escapeHtml(authorName)}</span>`:escapeHtml(authorName);
  const devBadge=author?.is_dev?' <span class="dev-badge">DEV</span>':"";
  document.getElementById("meta").innerHTML=`<a href="profile.html?user=${encodeURIComponent(handle)}" style="color:#ccc">${nameHtml}</a>${devBadge}<span>• ${clip.views||0} views</span><span>• ${escapeHtml(clip.visibility||"public")}</span>`;
  document.getElementById("description").textContent=clip.description||"";
  if((clip.visibility==="public"||clip.visibility==="unlisted")&&clip.id)client.from("clips").update({views:(clip.views||0)+1}).eq("id",clip.id);
  if(me){
    const{data:liked}=await client.from("clip_likes").select("user_id").eq("user_id",me.id).eq("clip_id",clip.id).maybeSingle();
    hasLiked=!!liked;
  }
  await renderActions(isOwner,amDev);await loadComments();
}

async function renderActions(isOwner,amDev){
  const actions=document.getElementById("actions");
  let html=`<button class="btn btn-outline" id="like-btn">${hasLiked?"Liked":"Like"} (${clip.likes_count||0})</button>`;
  if(me)html+=`<button class="btn btn-outline" id="save-btn">Save</button>`;
  html+=`<button class="btn btn-outline" id="copy-btn">Copy link</button>`;
  if(isOwner){
    if(clip.visibility!=="public")html+=`<button class="btn btn-green" onclick="setVisibility('public')">Make Public</button>`;
    if(clip.visibility!=="private")html+=`<button class="btn btn-outline" onclick="setVisibility('private')">Make Private</button>`;
    html+=`<a class="btn btn-green" href="editor.html?id=${encodeURIComponent(clip.id)}">Edit clip</a>`;
    html+=`<button class="btn btn-outline" onclick="deleteClip()">Delete</button>`;
  }else if(amDev)html+=`<button class="btn btn-outline" onclick="deleteClip()">DEV Delete</button>`;
  actions.innerHTML=html;
  document.getElementById("like-btn").onclick=likeClip;
  const s=document.getElementById("save-btn");if(s)s.onclick=saveClip;
  document.getElementById("copy-btn").onclick=async()=>{await navigator.clipboard.writeText(location.href);document.getElementById("copy-btn").textContent="Copied";};
  if(me)document.getElementById("comment-form-wrap").style.display="block";
}

async function likeClip(){
  if(!me){location.href="login.html";return;}
  const btn=document.getElementById("like-btn");
  if(hasLiked){
    await client.from("clip_likes").delete().eq("user_id",me.id).eq("clip_id",clip.id);
    const next=Math.max(0,(clip.likes_count||1)-1);
    await client.from("clips").update({likes_count:next}).eq("id",clip.id);
    clip.likes_count=next;hasLiked=false;btn.textContent="Like ("+next+")";return;
  }
  const{error}=await client.from("clip_likes").insert({user_id:me.id,clip_id:clip.id});
  if(error){if(/duplicate|unique|23505/i.test(error.message||"")){hasLiked=true;btn.textContent="Liked ("+(clip.likes_count||0)+")";return;}alert(error.message);return;}
  const next=(clip.likes_count||0)+1;
  await client.from("clips").update({likes_count:next}).eq("id",clip.id);
  clip.likes_count=next;hasLiked=true;btn.textContent="Liked ("+next+")";
}

async function saveClip(){
  const{error}=await client.from("saved_clips").insert({user_id:me.id,clip_id:clip.id});
  if(error&&!/duplicate|unique|23505/i.test(error.message||"")){alert(error.message);return;}
  document.getElementById("save-btn").textContent="Saved";
}

async function loadComments(){
  const box=document.getElementById("comment-list");
  const{data,error}=await client.from("comments").select("id,content,created_at,user_id").eq("clip_id",clip.id).order("created_at",{ascending:false});
  if(error){box.innerHTML=`<p class="empty">Unable to load comments.</p>`;return;}
  if(!data?.length){box.innerHTML=`<p class="empty">No comments yet.</p>`;return;}
  const ids=[...new Set(data.map(c=>c.user_id))];
  const{data:profiles}=await client.from("profiles").select("id,username,is_dev,rainbow_name").in("id",ids);
  const map={};(profiles||[]).forEach(p=>map[p.id]=p);
  box.innerHTML=data.map(c=>{
    const p=map[c.user_id];const badge=p?.is_dev?' <span class="dev-badge">DEV</span>':"";
    const who=p?.rainbow_name?`<span class="rainbow-name">@${escapeHtml(p.username||"user")}</span>`:`@${escapeHtml(p?.username||"user")}`;
    return `<div class="comment"><div class="who">${who}${badge}</div><div>${escapeHtml(c.content)}</div></div>`;
  }).join("");
}

document.getElementById("comment-btn").onclick=async()=>{
  if(!clip||!me){location.href="login.html";return;}
  const content=document.getElementById("comment-body").value.trim();if(!content)return;
  const{error}=await client.from("comments").insert({clip_id:clip.id,user_id:me.id,content});
  if(error){alert(error.message);return;}
  document.getElementById("comment-body").value="";await loadComments();
};

async function setVisibility(v){
  const{error}=await client.from("clips").update({visibility:v,published_at:v==="public"?new Date().toISOString():null}).eq("id",clip.id);
  if(error){alert(error.message);return;}location.reload();
}
async function deleteClip(){
  if(!confirm("Delete this clip forever?"))return;
  if(clip.file_path)await client.storage.from("clips").remove([clip.file_path]);
  const{error}=await client.from("clips").delete().eq("id",clip.id);
  if(error){alert(error.message);return;}location.href="profile.html";
}
loadClip();
</script>
</body>
</html>
