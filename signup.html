<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ClipNow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Signup-only styling. Does not change the shared ClipNow stylesheet. */
    .signup-page {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 72px;
      position: relative;
      overflow: hidden;
    }
    .signup-page::before,
    .signup-page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }
    .signup-page::before {
      width: 420px;
      height: 420px;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(34,197,94,.12), transparent 68%);
    }
    .signup-page::after {
      width: 220px;
      height: 220px;
      right: -70px;
      bottom: -80px;
      background: radial-gradient(circle, rgba(34,197,94,.08), transparent 70%);
    }
    .signup-card {
      width: min(100%, 430px);
      position: relative;
      z-index: 1;
      background: rgba(20,20,20,.94);
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 24px 70px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.02) inset;
    }
    .signup-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .signup-brand .signup-logo {
      display: inline-block;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.2px;
    }
    .signup-brand .signup-logo span { color: #22c55e; }
    .signup-brand h1 {
      margin-top: 22px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.4px;
    }
    .signup-brand p {
      color: #888;
      font-size: 14px;
      margin-top: 8px;
    }
    .signup-form { display: grid; gap: 17px; }
    .signup-field { display: grid; gap: 7px; }
    .signup-field label {
      font-size: 12px;
      font-weight: 600;
      color: #c7c7c7;
      letter-spacing: .15px;
    }
    .signup-field input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .signup-field input::placeholder { color: #5f5f5f; }
    .signup-field input:hover { border-color: #414141; }
    .signup-field input:focus {
      border-color: #22c55e;
      background: #171717;
      box-shadow: 0 0 0 3px rgba(34,197,94,.10);
    }
    .signup-submit {
      width: 100%;
      height: 46px;
      margin-top: 2px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: #07130b;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, background .15s, box-shadow .15s;
      box-shadow: 0 8px 24px rgba(34,197,94,.14);
    }
    .signup-submit:hover {
      background: #2dd46a;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(34,197,94,.20);
    }
    .signup-submit:active { transform: translateY(0); }
    .signup-submit:disabled { transform: none; }
    .signup-card .error,
    .signup-card .success { margin: 0 0 17px; }
    .signup-footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 22px;
    }
    .signup-footer a { color: #22c55e; font-weight: 600; }
    .signup-footer a:hover { color: #4ade80; }
    .signup-note {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 18px;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      .signup-page { padding: 28px 14px 50px; }
      .signup-card { padding: 26px 20px; border-radius: 15px; }
      .signup-brand h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
 <nav class="navbar" id="clipnow-navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>
  <div class="nav-center">
    <a href="index.html" id="nav-explore">Explore</a>
    <a href="upload.html" id="nav-upload">Upload</a>
    <a href="search.html" id="nav-search">Search</a>
    <a href="profile.html" id="nav-profile">Profile</a>
    <a href="download.html" id="nav-download">Download</a>
  </div>
  <div class="nav-right">
    <a href="login.html" id="nav-login" class="btn btn-primary">Sign in</a>
    <div id="nav-user">
      <a href="inbox.html" class="inbox-icon" title="Inbox" aria-label="Inbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"></path>
          <path d="M4 9h5l2 3h2l2-3h5"></path>
        </svg>
      </a>
      <a href="profile.html" id="nav-username" class="nav-username"></a>
      <button type="button" onclick="logout()" class="btn btn-outline">Logout</button>
    </div>
  </div>
</nav>

  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
      <div class="signup-brand">
        <a href="index.html" class="signup-logo">Clip<span>Now</span></a>
        <h1 id="signup-title">Create your account</h1>
        <p>Join the BuildNow.gg clip community.</p>
      </div>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <form id="form" class="signup-form">
        <div class="signup-field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" autocomplete="username" required minlength="3">
        </div>
        <div class="signup-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="signup-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">
        </div>
        <button type="submit" id="btn" class="signup-submit">Create Account</button>
      </form>

      <p class="signup-footer">Already have an account? <a href="login.html">Sign in</a></p>
      <p class="signup-note">Create an account to upload clips, follow creators and join ClipNow.</p>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="moderation.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("btn");
      errorEl.style.display = "none";
      successEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const username = sanitizeUsername(document.getElementById("username").value);
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        ClipNowModeration.assertTextAllowed(username, "username");

        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });
        if (error) throw error;

        if (data.user) {
          const { error: profileError } = await client.from("profiles").upsert({
            id: data.user.id,
            username,
            display_name: username,
            bio: "Hey im new to ClipNow",
            storage_used: 0
          });
          if (profileError) throw profileError;
        }

        if (data.session) {
          successEl.textContent = "Account created! Redirecting...";
          successEl.style.display = "block";
          setTimeout(() => { window.location.href = "profile.html"; }, 800);
        } else {
          successEl.textContent = "Account created. Check your email to confirm, then sign in.";
          successEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
