<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ClipNow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
 <nav class="navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>

  <div class="nav-center"></div>

  <div class="nav-right">

    <!-- Logged out -->
    <a href="login.html"
       id="nav-login"
       class="btn btn-primary">
      Sign in
    </a>

    <!-- Logged in -->
    <div id="nav-user"
         style="display:none; align-items:center; gap:12px;">

      <!-- Inbox icon ONLY -->
      <a href="inbox.html"
         class="inbox-icon"
         title="Inbox"
         aria-label="Inbox">

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M4 4h16v16H4z"></path>
          <path d="M4 9h5l2 3h2l2-3h5"></path>

        </svg>

      </a>

      <!-- Username -->
      <a href="profile.html"
         id="nav-username"
         class="nav-username">
      </a>

      <!-- Logout -->
      <button
        type="button"
        onclick="logout()"
        class="btn btn-outline">
        Logout
      </button>

    </div>

  </div>
</nav>

  <div class="auth-wrap">
    <h1>Create Account</h1>
    <p class="subtitle">Join ClipNow to upload and share clips</p>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    <form id="form">
      <label>Username</label>
      <input type="text" id="username" placeholder="Choose a username" required minlength="3">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
      <button type="submit" id="btn" class="auth-submit">Create Account</button>
    </form>
    <p class="footer-note">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("btn");
      errorEl.style.display = "none";
      successEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const username = sanitizeUsername(document.getElementById("username").value);
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });
        if (error) throw error;

        if (data.user) {
          await client.from("profiles").upsert({
            id: data.user.id,
            username,
            display_name: username,
            bio: "Hey im new to ClipNow",
            storage_used: 0
          });
        }

        if (data.session) {
          successEl.textContent = "Account created! Redirecting...";
          successEl.style.display = "block";
          setTimeout(() => { window.location.href = "profile.html"; }, 800);
        } else {
          successEl.textContent = "Account created. Check your email to confirm, then sign in.";
          successEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
