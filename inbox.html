<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox — ClipNow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>
  <div class="nav-center"></div>
  <div class="nav-right">
    <a href="login.html" id="nav-login" class="btn btn-primary">Sign in</a>
    <div id="nav-user" style="display:none;align-items:center;gap:12px">
      <a href="inbox.html" class="inbox-icon" title="Inbox" aria-label="Inbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"></path><path d="M4 9h5l2 3h2l2-3h5"></path></svg></a>
      <a href="profile.html" id="nav-username" class="nav-username"></a>
      <button type="button" onclick="logout()" class="btn btn-outline">Logout</button>
    </div>
  </div>
</nav>
<div class="container">
  <div class="page-head"><div><h1 class="page-title">Inbox</h1><p class="page-sub">Your notifications and messages.</p></div></div>
  <div class="inbox-wrap"><div id="inbox-list" class="inbox-list"><div class="empty-inbox">Loading...</div></div></div>
</div>
<script src="app.js"></script>
<script>
async function loadInbox() {
  const list = document.getElementById("inbox-list");
  try {
    if (!window.client) throw new Error("Supabase client failed to initialize.");
    const { data: { user }, error: userError } = await window.client.auth.getUser();
    if (userError || !user) {
      list.innerHTML = '<div class="empty-inbox"><h2>Sign in to view your inbox</h2><p>You need to be signed in to see your messages.</p><br><a href="login.html" class="btn btn-primary">Sign in</a></div>';
      return;
    }
    const { data, error } = await window.client.from("messages").select("*").eq("recipient_id", user.id).order("created_at", { ascending: false });
    if (error) {
      console.warn("Inbox:", error);
      list.innerHTML = '<div class="empty-inbox"><h2>Your inbox is empty</h2><p>You don\'t have any messages yet.</p></div>';
      return;
    }
    if (!data || !data.length) {
      list.innerHTML = '<div class="empty-inbox"><h2>Nothing here yet</h2><p>Your ClipNow notifications will appear here.</p></div>';
      return;
    }
    list.innerHTML = data.map(message => {
      const sender = message.sender_name || message.from_name || "ClipNow";
      const text = message.content || message.message || "You have a new message.";
      const date = message.created_at ? new Date(message.created_at).toLocaleString() : "";
      const unread = message.read === false || message.is_read === false;
      return `<div class="message ${unread ? "unread" : ""}"><div class="message-avatar">${escapeHtml(sender.charAt(0).toUpperCase())}</div><div class="message-content"><div class="message-top"><div class="message-name">${escapeHtml(sender)}</div><div class="message-date">${escapeHtml(date)}</div></div><div class="message-text">${escapeHtml(text)}</div></div>${unread ? '<div class="unread-dot"></div>' : ""}</div>`;
    }).join("");
  } catch (err) {
    console.error("Inbox:", err);
    list.innerHTML = `<div class="empty-inbox"><h2>Inbox unavailable</h2><p>${escapeHtml(err.message || "Something went wrong.")}</p></div>`;
  }
}
loadInbox();
</script>
</body>
</html>
