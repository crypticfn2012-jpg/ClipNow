<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox — ClipNow</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .inbox-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .inbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: rgba(255,255,255,.025);
      transition: .2s ease;
    }

    .message:hover {
      background: rgba(255,255,255,.045);
      border-color: rgba(255,255,255,.13);
    }

    .message.unread {
      background: rgba(34,197,94,.055);
      border-color: rgba(34,197,94,.16);
    }

    .message-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202020;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 4px;
    }

    .message-name {
      font-weight: 700;
      color: #fff;
    }

    .message-date {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
    }

    .message-text {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    .empty-inbox {
      text-align: center;
      padding: 70px 20px;
      color: #777;
    }

    .empty-inbox svg {
      width: 42px;
      height: 42px;
      margin-bottom: 15px;
      opacity: .45;
    }

    .empty-inbox h2 {
      margin: 0 0 7px;
      color: #ddd;
      font-size: 20px;
    }

    .empty-inbox p {
      margin: 0;
      color: #777;
    }
  </style>

</head>

<body>

<nav class="navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>

  <div class="nav-center"></div>

  <div class="nav-right">

    <!-- Logged out -->
    <a href="login.html"
       id="nav-login"
       class="btn btn-primary">
      Sign in
    </a>

    <!-- Logged in -->
    <div id="nav-user"
         style="display:none; align-items:center; gap:12px;">

      <!-- Inbox icon ONLY -->
      <a href="inbox.html"
         class="inbox-icon"
         title="Inbox"
         aria-label="Inbox">

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M4 4h16v16H4z"></path>
          <path d="M4 9h5l2 3h2l2-3h5"></path>

        </svg>

      </a>

      <!-- Username -->
      <a href="profile.html"
         id="nav-username"
         class="nav-username">
      </a>

      <!-- Logout -->
      <button
        type="button"
        onclick="logout()"
        class="btn btn-outline">
        Logout
      </button>

    </div>

  </div>
</nav>

<div class="container">

  <div class="page-head">
    <div>
      <h1 class="page-title">Inbox</h1>
      <p class="page-sub">
        Your notifications and messages.
      </p>
    </div>
  </div>

  <div class="inbox-wrap">


<div id="inbox-list" class="inbox-list">

  <div class="empty-inbox">
    Loading...
  </div>

</div>


  </div>

</div>

<script src="app.js"></script>

<script>

async function loadInbox() {

  const list = document.getElementById("inbox-list");

  try {

    if (!window.supabaseClient) {
      list.innerHTML = `
        <div class="empty-inbox">
          <h2>Inbox unavailable</h2>
          <p>Your Supabase client isn't available.</p>
        </div>
      `;
      return;
    }

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

      list.innerHTML = `
        <div class="empty-inbox">
          <h2>Sign in to view your inbox</h2>
          <p>You need to be signed in to see your messages.</p>
          <br>
          <a href="login.html" class="btn btn-primary">
            Sign in
          </a>
        </div>
      `;

      return;
    }

    const { data, error } = await supabaseClient
      .from("messages")
      .select("*")
      .eq("recipient_id", user.id)
      .order("created_at", { ascending: false });

    if (error) {

      console.warn("Inbox:", error);

      list.innerHTML = `
        <div class="empty-inbox">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M4 4h16v16H4z"/>
            <path d="M4 9h5l2 3h2l2-3h5"/>
          </svg>

          <h2>Your inbox is empty</h2>

          <p>
            You don't have any messages yet.
          </p>
        </div>
      `;

      return;
    }

    if (!data || !data.length) {

      list.innerHTML = `
        <div class="empty-inbox">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M4 4h16v16H4z"/>
            <path d="M4 9h5l2 3h2l2-3h5"/>
          </svg>

          <h2>Nothing here yet</h2>

          <p>
            Your ClipNow notifications will appear here.
          </p>

        </div>
      `;

      return;
    }

    list.innerHTML = data.map(message => {

      const sender =
        message.sender_name ||
        message.from_name ||
        "ClipNow";

      const text =
        message.content ||
        message.message ||
        "You have a new message.";

      const date = message.created_at
        ? new Date(message.created_at).toLocaleString()
        : "";

      const unread =
        message.read === false ||
        message.is_read === false;

      const initial =
        escapeHtml(sender.charAt(0).toUpperCase());

      return `
        <div class="message ${unread ? "unread" : ""}">

          <div class="message-avatar">
            ${initial}
          </div>

          <div class="message-content">

            <div class="message-top">

              <div class="message-name">
                ${escapeHtml(sender)}
              </div>

              <div class="message-date">
                ${escapeHtml(date)}
              </div>

            </div>

            <div class="message-text">
              ${escapeHtml(text)}
            </div>

          </div>

          ${unread ? '<div class="unread-dot"></div>' : ""}

        </div>
      `;

    }).join("");

  } catch (err) {

    console.error(err);

    list.innerHTML = `
      <div class="empty-inbox">
        <h2>Nothing here yet</h2>
        <p>Your inbox doesn't have any messages.</p>
      </div>
    `;

  }

}

loadInbox();

</script>

</body>
</html>
