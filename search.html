<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - ClipNow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .search-user-row { display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%; }
    .search-user-main { display:flex;align-items:center;gap:10px;min-width:0; }
  </style>
</head>
<body>
<nav class="navbar" id="clipnow-navbar">
  <a href="index.html" class="logo">Clip<span>Now</span></a>
  <div class="nav-center">
    <a href="index.html" id="nav-explore">Explore</a>
    <a href="upload.html" id="nav-upload">Upload</a>
    <a href="search.html" id="nav-search">Search</a>
    <a href="profile.html" id="nav-profile">Profile</a>
    <a href="download.html" id="nav-download">Download</a>
  </div>
  <div class="nav-right">
    <a href="login.html" id="nav-login" class="btn btn-primary">Sign in</a>
    <div id="nav-user">
      <a href="profile.html" id="nav-username" class="nav-username"></a>
      <button type="button" onclick="logout()" class="btn btn-outline">Logout</button>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">Search</h1>
  <div class="search-bar"><input type="text" id="q" placeholder="Search clips or users..."><button id="go">Search</button></div>
  <h2 class="section-title">Users</h2>
  <div id="users"></div>
  <h2 class="section-title">Clips</h2>
  <div id="clips" class="clip-grid"></div>
</div>

<script src="app.js"></script>
<script src="social.js"></script>
<script>
async function runSearch() {
  const q = document.getElementById("q").value.trim();
  const usersBox = document.getElementById("users");
  const clipsBox = document.getElementById("clips");
  if (!q) { usersBox.innerHTML = `<p class="empty">Type a query.</p>`; clipsBox.innerHTML = ""; return; }
  usersBox.innerHTML = `<p class="empty">Loading...</p>`; clipsBox.innerHTML = `<p class="empty">Loading...</p>`;

  const { data: users } = await client.from("profiles")
    .select("id, username, display_name, avatar_url, is_dev, rainbow_name")
    .or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(20);

  if (!users?.length) usersBox.innerHTML = `<p class="empty">No users.</p>`;
  else {
    const me = await getCurrentUser();
    const rows = await Promise.all(users.map(async u => {
      const badge = u.is_dev ? ' <span class="dev-badge">DEV</span>' : "";
      const name = u.rainbow_name ? `<span class="rainbow-name">${escapeHtml(u.display_name || u.username)}</span>` : escapeHtml(u.display_name || u.username);
      const av = u.avatar_url ? `<img class="avatar-sm" src="${escapeHtml(u.avatar_url)}" alt="">` : `<div class="avatar-sm">${escapeHtml((u.username || "?").charAt(0).toUpperCase())}</div>`;
      const follow = me && me.id !== u.id ? `<button type="button" class="btn btn-green follow-btn" data-follow-user="${escapeHtml(u.id)}" onclick="event.preventDefault();event.stopPropagation();toggleFollow('${String(u.id).replace(/'/g, "\\'")}', this)">Follow</button>` : "";
      return `<div class="user-card"><a class="search-user-main" href="profile.html?user=${encodeURIComponent(u.username)}">${av}<div><div style="font-weight:500">${name}${badge}</div><div style="font-size:13px;color:#888">@${escapeHtml(u.username)}</div></div></a>${follow}</div>`;
    }));
    usersBox.innerHTML = rows.join("");
    await refreshSearchFollowButtons();
  }

  const { data: clips } = await client.from("clips").select("*").eq("visibility", "public").ilike("title", `%${q}%`).order("created_at", { ascending:false }).limit(40);
  const list = clips || [];
  if (list.length) {
    const ids = [...new Set(list.map(c => c.user_id).filter(Boolean))];
    const { data: profiles } = await client.from("profiles").select("id, username, display_name, avatar_url, is_dev, rainbow_name").in("id", ids);
    const map = {}; (profiles || []).forEach(p => (map[p.id] = p)); list.forEach(c => (c.profiles = map[c.user_id] || null));
  }
  if (!list.length) clipsBox.innerHTML = `<p class="empty">No clips.</p>`;
  else { clipsBox.innerHTML = list.map(c => clipCardHtml(c)).join(""); if (typeof hydrateThumbnails === "function") await hydrateThumbnails(clipsBox); }
}

document.getElementById("go").onclick = runSearch;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
const preset = new URLSearchParams(location.search).get("q");
if (preset) { document.getElementById("q").value = preset; runSearch(); }
</script>
</body>
</html>
